name: Validate source package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libncurses-dev zlib1g-dev libzstd-dev librtlsdr-dev libusb-1.0-0-dev python3-numpy python3-scipy
      - name: Prepare and build pinned RTL-SDR source
        run: python3 tools/prepare.py build/readsb --build --rtlsdr
      - name: Native and stock checks
        run: |
          make -C build/readsb test
          make -C build/readsb dsp-rescue-test
          make -C build/readsb dsp-rescue-test-sanitize
      - name: Offline reference checks
        run: make -C build/readsb/contrib/dsp-rescue test PYTHON=/usr/bin/python3
      - name: Build untouched stock for paired controls
        run: |
          git clone --no-hardlinks build/readsb build/stock
          git -C build/stock checkout --detach 9460652952a62fcfd9bf11a2664d737147f266a5
          make -C build/stock -j2
      - name: Synthetic paired replay and noise controls
        run: /usr/bin/python3 build/readsb/tests/dsp-rescue/replay.py --readsb build/readsb/readsb --stock-readsb build/stock/readsb --output build/generated-controls.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-controls
          path: build/generated-controls.json

  integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libncurses-dev zlib1g-dev libzstd-dev
          python -m pip install -e .
      - name: Build integrated native frontend and readsb
        run: deadsb build
      - name: Coherent typed-sort regression and sanitizers
        run: |
          cc -O3 -std=c11 -Isrc/rescue experiments/coherent-sort/check_sort.c -lm -o /tmp/coherent-sort-check
          /tmp/coherent-sort-check
          cc -O1 -g -fsanitize=address,undefined -Isrc/rescue experiments/coherent-sort/check_sort.c -lm -o /tmp/coherent-sort-sanitize
          /tmp/coherent-sort-sanitize
      - name: Controller, dashboard and worker integration
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - name: Stock and native guards
        run: make -C readsb test dsp-rescue-test dsp-rescue-test-sanitize

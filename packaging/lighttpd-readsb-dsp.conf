# Enable mod_proxy and mod_redirect. New installations only; do not replace
# an existing statistics/capture mapping with this budget-dashboard example.
$HTTP["url"] == "/readsb-dsp" {
    url.redirect = ( "^/readsb-dsp$" => "/readsb-dsp/" )
}
$HTTP["url"] =~ "^/readsb-dsp/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8912 )))
    proxy.header = ( "map-urlpath" => ( "/readsb-dsp/" => "/" ))
}
